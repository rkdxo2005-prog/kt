<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>두 권의 수첩</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="조지 오웰과 니코스 카잔차키스의 눈으로 1인칭으로 겪는 스페인 내전(1936–1937). 겪고, 적고, 그들이 실제로 쓴 문장과 맞춰 보는 서사 게임">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;500;600;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Brush+Script&family=Nanum+Pen+Script&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="bar" id="bar">
  <div class="bar-in">
    <button class="brand" id="brand" aria-label="표지로 돌아가기">
      <svg viewBox="0 0 28 22" aria-hidden="true"><path d="M2 3h10a3 3 0 0 1 3 3v14a2 2 0 0 0-2-2H2z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M26 3H16a3 3 0 0 0-3 3v14a2 2 0 0 1 2-2h11z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      <span>두 권의 수첩</span>
    </button>
    <div class="bar-mid" id="bar-mid"></div>
    <div class="bar-act">
      <button class="chip" id="btn-book" hidden><span class="chip-ico" aria-hidden="true">✎</span><span>수첩</span><span class="chip-n" id="note-count">0</span></button>
      <button class="chip" id="btn-sound" aria-pressed="false" title="소리 켜기/끄기"><span class="chip-ico" aria-hidden="true">♪</span><span id="sound-label">소리 꺼짐</span></button>
    </div>
  </div>
</header>

<main id="screen"></main>

<aside class="drawer" id="drawer" hidden aria-label="수첩">
  <div class="drawer-head">
    <div class="tabs" id="drawer-tabs" role="tablist"></div>
    <button class="x" id="drawer-x" aria-label="수첩 닫기">×</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>
<div class="scrim" id="scrim" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/mapdata.js"></script>
<script src="js/maps.js"></script>
<script src="js/echoes.js"></script>
<script src="js/paint.js"></script>
<script src="js/plates.js"></script>
<script src="js/sound.js"></script>
<script src="js/orwell.js"></script>
<script src="js/kazantzakis.js"></script>
<script src="js/games.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
